# Example tagi.toml configuration file
# Copy this to tagi.toml in your repository root to customize tagging

[tags]
# Define custom tag groups for file patterns
frontend = ["frontend/", "client/", "web/", "ui/"]
backend = ["backend/", "server/", "api/"]
database = ["db/", "database/", "migration/", "models/"]
infrastructure = ["infra/", "deploy/", "docker/", "k8s/"]

[rules]
# Map file patterns to specific tags
# Format: "pattern" = "tag"
"frontend/" = "#frontend"
"backend/" = "#backend"
"db/" = "#database"
"migration/" = "#risky"
"docker" = "#infra"
"k8s" = "#infra"
"auth" = "#risky"
"security" = "#risky"

[colors]
# Custom colors for tags (Rich color names)
# Available colors: red, green, blue, yellow, cyan, magenta, white, bright_red, bright_green, etc.
"#frontend" = "blue"
"#backend" = "green"
"#database" = "yellow"
"#risky" = "red"
"#infra" = "bright_yellow"

[heuristics]
# Custom heuristics - map patterns to multiple tags
# Format: "pattern" = ["#tag1", "#tag2", ...]
"api/" = ["#api", "#backend"]
"cli/" = ["#cli", "#tool"]
"scripts/" = ["#scripts", "#tool"]
"migration/" = ["#risky", "#database"]

[tag_definitions]
# Custom descriptions for tags
# Format: "#tag" = "description"
"#small" = "Small changes (< 10 lines)"
"#large" = "Large changes (> 100 lines)"
"#risky" = "High-risk changes (auth, migration, security)"
"#docs" = "Documentation changes"

[templates]
# Custom commit message templates
# Use {tag}, {files}, {count} as placeholders
default = "{tag}: {count} files ({files})"
detailed = "Commit {tag}\n\nFiles changed ({count}):\n{files}\n\nGenerated by tagi"

[ignore]
# Patterns to ignore when scanning
# Format: ["pattern1", "pattern2", ...]
["node_modules/", ".git/", "__pycache__/", "*.pyc", ".idea/", ".vscode/"]
